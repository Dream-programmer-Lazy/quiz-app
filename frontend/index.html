<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Luyện thi CNTT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="login-screen">
      <h2>Đăng nhập</h2>
      <input type="text" id="username" placeholder="Nhập tên người dùng" maxlength="20" />
      <button onclick="handleLogin()">Vào thi</button>
    </div>


    <div id="settings-screen" style="display:none;">
      <h2>Cài đặt</h2>
      <label><input type="checkbox" id="bgMusic"> Nhạc nền</label>
      <label><input type="checkbox" id="soundFx"> Âm thanh (đúng/sai)</label>
      <label><input type="checkbox" id="questionTimer"> Timer mỗi câu</label>
      <label><input type="checkbox" id="testTimer"> Timer toàn bài</label>
      <label>
        Số câu: 
        <select id="numQuestions">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
        </select>
      </label>
      <h3>Chọn avatar:</h3>
      <div id="avatar-list"></div>
      <button onclick="saveSettings()">Lưu & Bắt đầu</button>
    </div>

    <div id="quiz-screen" style="display:none;">
      <div id="header">
        <div id="timer-display">Còn: <span id="time-left">60</span>s</div>
        <div id="question-count">Câu: <span id="current-q">1</span>/<span id="total-q">5</span></div>
        <img id="user-avatar" src="assets/avatars/avatar1.png" alt="Avatar" />
      </div>
      <div id="question-content"></div>
      <div id="answer-buttons"></div>
    </div>


    <div id="result-screen" style="display:none;">
      <h2>Kết quả</h2>
      <p>Bạn đạt: <strong id="score-result">0</strong>/<span id="total-result">5</span></p>
      <button onclick="restartQuiz()">Làm lại</button>
      <button onclick="goToAddQuestion()">Thêm câu hỏi</button>
    </div>


    <div id="add-question-form" style="display:none; margin-top: 20px; padding: 15px; border: 1px solid #ccc;">
      <h3> Thêm câu hỏi</h3>
      <textarea id="q-content" placeholder="Nội dung câu hỏi" rows="3" style="width:100%"></textarea><br/>
      <label>
        <input type="radio" name="q-type" value="true_false" checked> Đúng/Sai
        <input type="radio" name="q-type" value="multiple_choice"> 4 lựa chọn
      </label><br/>
      <div id="options-container">

      </div>
      <button onclick="submitNewQuestion()">Gửi câu hỏi</button>
    </div>
  </div>

  <audio id="correct-sound" src="assets/sounds/correct.mp3"></audio>
  <audio id="wrong-sound" src="assets/sounds/wrong.mp3"></audio>
  <audio id="bg-music" src="assets/sounds/background.mp3" loop></audio>

  <script src="script.js"></script>
</body>
</html>
